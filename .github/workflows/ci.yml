name: ci

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  selflint:
    name: skillcrit lints itself
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Annotations land on the diff; the gate is a separate step so a
      # failure says "the gate tripped", not "the annotator crashed".
      # Exit 1 means "findings", which is this step's job to report, not to
      # fail on. Anything else (2 usage, 3 error) still fails the step.
      - name: annotate
        run: node dist/cli.js lint . --format github || [ $? -eq 1 ]
      - name: sarif
        run: node dist/cli.js lint . --format sarif > skillcrit.sarif || [ $? -eq 1 ]
      - name: upload sarif
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skillcrit.sarif
          category: skillcrit
        continue-on-error: true
      - name: gate
        run: node dist/cli.js lint . --fail-on error
